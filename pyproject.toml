[project]
name = "sober-freeze"
version = "0.1.0"
description = "Freeze / thaw Sober (or the focused app): toggle, hold-to-freeze, auto-unfreeze, CLI and GUI"
requires-python = ">=3.11"
dependencies = [
    "PySide6",
    "evdev",
    "tomli_w",
]

[project.scripts]
sober-freeze = "sober_freeze.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sober_freeze*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
